name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx @biomejs/biome ci .

      - name: Typecheck
        run: npm run typecheck

      # The tools use DisposableStack, a global Node has from version 24, so their tests run on that row only.
      # The library is tested on every row.
      - name: Run tests
        if: matrix.node-version == 24
        run: npm test

      - name: Run the library's tests
        if: matrix.node-version != 24
        run: npm test --workspace @state-flow/core

      - name: Build
        run: npm run build

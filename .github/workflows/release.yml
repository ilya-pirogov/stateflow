name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for trusted publishing and npm provenance

jobs:
  publish:
    # A tag publishes both packages, whose manifests carry the same version. Each has its own job: a version cannot be
    # published twice, so a job that failed is rerun alone.
    name: Publish ${{ matrix.package }} to npm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, tools]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The tools' tests, which run before the publish, need Node 24 (see ci.yml).
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The packages live in packages/; the licence they ship with lives at the repository root, and so does the README
      # the library ships with.
      - name: Copy LICENSE into the package
        run: cp LICENSE packages/${{ matrix.package }}/

      - name: Copy README into the library
        if: matrix.package == 'core'
        run: cp README.md packages/core/

      # npm takes the workflow's identity (trusted publishing): no token is stored, and the provenance is generated.
      - name: Publish
        run: npm publish --workspace @state-flow/${{ matrix.package }} --access public
